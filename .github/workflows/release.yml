# Release thủ công: vào tab Actions → Release → Run workflow.
# Build app desktop (Windows, macOS, Ubuntu) và extension Chrome/Edge, gắn vào GitHub Release
# có tag v<version>. Version nhập lúc chạy, được ghi vào tauri.conf.json và manifest.json của
# extension ngay trên máy build (không sửa file trong repo).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version phát hành, dạng x.y.z (ví dụ 0.2.0)"
        type: string
        required: true
      draft:
        description: "Để ở dạng nháp (xem lại rồi tự bấm Publish trên GitHub)"
        type: boolean
        default: true
      prerelease:
        description: "Đánh dấu là pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Kiểm tra
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      # Tauri cần thư mục dist của frontend lúc compile.
      - run: pnpm --filter desktop build
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  create-release:
    name: Tạo release nháp
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.result }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Chrome chỉ nhận version dạng số, nên không dùng hậu tố kiểu -beta.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version \"$VERSION\" không hợp lệ, cần dạng x.y.z (ví dụ 0.2.0)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const prerelease = process.env.PRERELEASE === "true";
            const body = [
              "## Cài đặt",
              "",
              "| Nền tảng | File |",
              "|---|---|",
              "| Windows | `Authenticator_*_x64-setup.exe` |",
              "| macOS (Intel và Apple Silicon) | `Authenticator_*_universal.dmg` |",
              "| Ubuntu / Debian | `Authenticator_*_amd64.deb` (`sudo apt install ./file.deb`) hoặc `.AppImage` (`chmod +x` rồi chạy) |",
              "| Extension Chrome / Edge | `authenticator-extension-*.zip` |",
              "",
              "- App chưa ký số: Windows báo SmartScreen thì chọn **More info → Run anyway**; macOS lần đầu chuột phải vào app → **Open** (hoặc `xattr -cr /Applications/Authenticator.app`).",
              "- Extension: giải nén zip, mở `chrome://extensions` (hoặc `edge://extensions`), bật **Developer mode** → **Load unpacked** → chọn thư mục vừa giải nén.",
              "- Trên macOS và Ubuntu cần đặt master password. Kết nối extension và đăng nhập Google hiện chỉ chạy trên Windows.",
            ].join("\n");

            // Release nháp không tìm được bằng API theo tag, nên duyệt danh sách.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing && !existing.draft) {
              core.setFailed(`Release ${tag} đã phát hành. Chạy lại với version mới hơn.`);
              return;
            }
            if (existing) {
              // Chạy lại workflow: dùng lại bản nháp, file build mới sẽ ghi đè file cũ.
              await github.rest.repos.updateRelease({
                owner, repo, release_id: existing.id, target_commitish: context.sha, prerelease, body,
              });
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `Authenticator ${tag}`, body, draft: true, prerelease,
            });
            return data.id;

  build-desktop:
    name: Desktop (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - name: Ubuntu
            os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cài thư viện hệ thống
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Ghi version
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          conf=desktop/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"
      # Cấu hình OAuth không nằm trong git; build.rs nhúng file này vào app nếu có.
      - name: Nhúng cấu hình Google OAuth
        shell: bash
        env:
          GOOGLE_OAUTH_CONFIG: ${{ secrets.GOOGLE_OAUTH_CONFIG }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CONFIG" ]; then
            echo "::warning::Chưa có secret GOOGLE_OAUTH_CONFIG, bản build này không đăng nhập Google được."
          else
            printf '%s' "$GOOGLE_OAUTH_CONFIG" > desktop/src-tauri/google-oauth.json
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ matrix.args }}

  build-extension:
    name: Extension Chrome / Edge
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ghi version
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          manifest=extension/public/manifest.json
          jq --arg v "$VERSION" '.version = $v' "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
      - run: pnpm build:extension
      - name: Đóng gói
        # Không đặt tên biến là ZIP: lệnh zip đọc biến môi trường ZIP làm tuỳ chọn mặc định.
        env:
          ASSET: authenticator-extension-${{ needs.create-release.outputs.version }}.zip
        run: (cd extension/dist && zip -r "$GITHUB_WORKSPACE/$ASSET" .)
      # Release đang là bản nháp nên chưa có tag, phải upload theo ID (gh release upload tìm theo tag).
      - name: Upload lên release
        uses: actions/github-script@v7
        env:
          ASSET: authenticator-extension-${{ needs.create-release.outputs.version }}.zip
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const name = process.env.ASSET;
            // Chạy lại workflow: xoá file cũ cùng tên trước khi upload.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            for (const asset of assets.filter((a) => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name,
              data: fs.readFileSync(name),
              headers: { "content-type": "application/zip", "content-length": fs.statSync(name).size },
            });

  publish:
    name: Phát hành
    needs: [create-release, build-desktop, build-extension]
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.updateRelease({
              owner, repo, release_id: Number(process.env.RELEASE_ID), draft: false,
            });
